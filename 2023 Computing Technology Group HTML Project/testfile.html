<!DOCTYPE html>
<html>
<head>
	<title>Job Application</title>
</head>
<body>

	<h1>Job Application Form</h1>

	<form>
		<label for="name">Name:</label>
		<input type="text" id="name" name="name" required><br><br>

		<label for="email">Email:</label>
		<input type="email" id="email" name="email" required><br><br>

		<label for="phone">Phone Number:</label>
		<input type="tel" id="phone" name="phone" required><br><br>

		<label for="resume">Resume:</label>
		<input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx"><br><br>

		<label for="position">Position:</label>
		<select id="position" name="position" required>
			<option value="" disabled selected>Select a position</option>
			<option value="web-developer">Web Developer</option>
			<option value="graphic-designer">Graphic Designer</option>
			<option value="marketing-specialist">Marketing Specialist</option>
		</select><br><br>

		<label for="salary">Desired Salary:</label>
		<input type="number" id="salary" name="salary"><br><br>

		<label for="availability">Availability:</label>
		<input type="radio" id="full-time" name="availability" value="full-time">
		<label for="full-time">Full-time</label>
		<input type="radio" id="part-time" name="availability" value="part-time">
		<label for="part-time">Part-time</label><br><br>

		<label for="start-date">Available Start Date:</label>
		<input type="date" id="start-date" name="start-date"><br><br>

		<input type="submit" value="Submit">
	</form>

</body>
</html>
